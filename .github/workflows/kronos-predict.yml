name: Kronos 股票预测

# 每天 08:00 和 11:30 北京时间自动运行（GitHub cron 使用 UTC，北京 = UTC+8）：
#   08:00 北京 = 00:00 UTC  ->  "0 0 * * 1-5"
#   11:30 北京 = 03:30 UTC  ->  "30 3 * * 1-5"
# 1-5 表示周一至周五，周末不开盘不发邮件。
# 也可通过 "Run workflow" 按钮手动触发一次。
on:
  # schedule:
  #   - cron: "0 0 * * 1-5"
  workflow_dispatch: {}
  repository_dispatch:
    types:
    - curl-event

env:
  # 股票代码在仓库 Settings -> Secrets and variables -> Actions -> Variables 里配 STOCK_CODE
  # 未配置时脚本回退到默认值 "601601|002185"
  STOCK_CODE: ${{ vars.STOCK_CODE }}
  # 模型下载地址：GitHub 官方 runner 在国外，直连官方 huggingface.co 更快更稳。
  # 脚本默认的 hf-mirror.com 是国内镜像，在 CI 上可能连不上导致"from_pretrained 下载 config 失败"。
  # 若用国内自建 runner，可在 Variables 里加 HF_ENDPOINT=https://hf-mirror.com 覆盖。
  HF_ENDPOINT: ${{ vars.HF_ENDPOINT || 'https://huggingface.co' }}

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 缓存 HuggingFace 模型，避免每次重复下载 Kronos-base（几百 MB）
      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-huggingface-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 安装中文字体（文泉驿正黑），否则 matplotlib 画 K 线图的中文会乱码（默认镜像无该字体）
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei

      # 邮箱配置在仓库 Settings -> Secrets and variables -> Actions -> Secrets 里设置：
      #   SMTP_HOST=smtp.qq.com  SMTP_PORT=465  SMTP_PROTOCOL=ssl
      #   SMTP_USER=<QQ邮箱>     SMTP_PASS=<QQ邮箱授权码>   SMTP_RECIPIENT=<收件邮箱>
      # 脚本会在每只股票跑完所有周期后，立即用 smtplib 发送一封该股票的预测邮件
      # （HTML 正文、K 线图 base64 内嵌、标题含股票代码），因此这里注入 SMTP_* 环境变量。
      # 邮件已由脚本直接发送，不再使用 dawidd6/action-send-mail 步骤（避免重复发信）。
      - name: Run prediction
        run: python kronos_predict.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_PROTOCOL: ${{ secrets.SMTP_PROTOCOL || 'ssl' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_RECIPIENT: ${{ secrets.SMTP_RECIPIENT }}

      # 说明：如需改回用 dawidd6/action-send-mail 发一封汇总邮件，可恢复下面被注释的步骤，
      # 并移除上方 Run prediction 步骤里注入的 SMTP_* 环境变量（避免脚本与 action 重复发信）。
      # - name: Get date
      #   id: date
      #   run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
      # - name: Send mail
      #   uses: dawidd6/action-send-mail@v18
      #   with:
      #     server_address: ${{ secrets.SMTP_HOST }}
      #     server_port: 465
      #     secure: true
      #     username: ${{ secrets.SMTP_USER }}
      #     password: ${{ secrets.SMTP_PASS }}
      #     subject: Kronos 股票预测日报 ${{ steps.date.outputs.date }}
      #     to: ${{ secrets.SMTP_RECIPIENT }}
      #     from: ${{ secrets.SMTP_USER }}
      #     html_body: file://outputs/summary.html
      #     nodemailerlog: true
